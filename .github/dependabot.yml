version: 2

updates:
  - package-ecosystem: npm
    directory: "/nichesurage"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Belgrade
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
